[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "who-is-in-the-majority"
version = "0.1.0"
description = "多数幻觉与表达行为实验的 Python 框架"
requires-python = ">=3.11"
dependencies = ["openai>=2.21,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
experiments = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["majority*"]

[tool.setuptools.package-data]
majority = ["prompts/*.md"]
